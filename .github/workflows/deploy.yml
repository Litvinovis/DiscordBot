name: Build & Deploy — Stonks Bot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        default: 'main'
        required: false

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Java 25
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-25-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Build & Test
        run: mvn package -B

      - name: Deploy (only on push/dispatch to main)
        if: github.event_name != 'pull_request'
        run: |
          DEPLOY_DIR=/opt/DiscordBot
          JAR_NAME=DiscordBot.jar
          SERVICE=bot-discord

          JAR_PATH="$DEPLOY_DIR/$JAR_NAME"
          if [ -f "$JAR_PATH" ]; then
            sudo cp "$JAR_PATH" "$JAR_PATH.backup.$(date +%Y%m%d_%H%M%S)"
            ls -t "$JAR_PATH".backup.* | tail -n +4 | sudo xargs -r rm -f
          fi

          # Старая JVM может читать JAR до завершения. Атомарная замена
          # оставляет старый файл доступным через уже открытый дескриптор.
          STAGED_JAR=$(sudo mktemp "$JAR_PATH.XXXXXX")
          trap 'sudo rm -f -- "$STAGED_JAR"' EXIT
          sudo install -m 644 target/$JAR_NAME "$STAGED_JAR"
          sudo mv -fT -- "$STAGED_JAR" "$JAR_PATH"

          # Restart service
          sudo systemctl restart ${SERVICE}

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          rollback() {
            JAR_PATH=/opt/DiscordBot/DiscordBot.jar
            LATEST_BACKUP=$({ ls -t "$JAR_PATH".backup.* 2>/dev/null || true; } | sed -n '1p')
            if [ -n "$LATEST_BACKUP" ]; then
              STAGED_JAR=$(sudo mktemp "$JAR_PATH.XXXXXX")
              trap 'sudo rm -f -- "$STAGED_JAR"' EXIT
              sudo install -m 644 "$LATEST_BACKUP" "$STAGED_JAR"
              sudo mv -fT -- "$STAGED_JAR" "$JAR_PATH"
              sudo systemctl restart bot-discord
            fi
          }

          echo "Waiting for bot to start..."
          RESTARTS_BEFORE=$(systemctl show -p NRestarts --value bot-discord)
          sleep 15
          STATUS=$(sudo systemctl is-active bot-discord || true)
          RESTARTS_AFTER=$(systemctl show -p NRestarts --value bot-discord)
          # Restart=always: падающий в цикле сервис может попасть на момент "active"
          if [ "$STATUS" != "active" ] || [ "$RESTARTS_AFTER" != "$RESTARTS_BEFORE" ]; then
            echo "❌ Bot failed to start (status=$STATUS, restarts $RESTARTS_BEFORE→$RESTARTS_AFTER), rolling back..."
            rollback
            exit 1
          fi
          # Check for fatal errors in logs
          ERRORS=$(sudo journalctl -u bot-discord -n 20 --no-pager | grep -c "ERROR\|FATAL\|Exception in thread" || true)
          if [ "$ERRORS" -gt 2 ]; then
            echo "❌ Too many errors in logs ($ERRORS), rolling back..."
            rollback
            exit 1
          fi
          echo "✅ Bot is running fine"

      - name: Notify Telegram
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *Stonks Bot* задеплоен%0Aветка: \`${{ github.ref_name }}\`%0Aкоммит: ${{ github.sha }}"
          else
            MSG="❌ *Stonks Bot* — деплой упал%0Aветка: \`${{ github.ref_name }}\`%0Aсмотри: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null
